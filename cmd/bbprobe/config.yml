# Embedded default blackbox configuration for bbprobe.
# Used when --config is not supplied, so the binary is "configless" out of the box.
# Override any of these by passing --config /path/to/blackbox.yml.
modules:
  # ---- HTTP ----
  http_2xx:
    prober: http
    http:
      method: GET
      valid_status_codes: []          # defaults to 2xx
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  http_post_2xx:
    prober: http
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{}'
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  https_2xx:
    prober: http
    http:
      method: GET
      fail_if_not_ssl: true
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        insecure_skip_verify: false

  # ---- TCP ----
  tcp_connect:
    prober: tcp
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # ---- ICMP (unprivileged where the OS allows it) ----
  icmp:
    prober: icmp
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # ---- DNS ----
  dns_udp:
    prober: dns
    dns:
      transport_protocol: udp
      query_name: www.prometheus.io
      query_type: A
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  dns_tcp:
    prober: dns
    dns:
      transport_protocol: tcp
      query_name: www.prometheus.io
      query_type: A
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # ---- gRPC ----
  grpc:
    prober: grpc
    grpc:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
